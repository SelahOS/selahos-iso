# SelahOS: disable Wi-Fi power-saving.
#
# 2026-09-05: on a real MacBook10,1 (Broadcom BCM4350, brcmfmac), Wi-Fi
# associated to an AP and then dropped within seconds — every time,
# reproducible in the live installer environment. Kernel log showed
# brcmfmac running with NO clm_blob/txcap_blob/nvram calibration data
# (those Apple-board-specific files aren't in upstream linux-firmware),
# so the radio has no proper power/channel tuning. NetworkManager's
# default Wi-Fi power-saving is the single most commonly cited cause of
# exactly this "connects then drops" pattern on brcmfmac, independent of
# the missing calibration data, and disabling it is the standard,
# well-established mitigation for this whole hardware class.
#
# 2026-09-06 UPDATE: retested on real hardware — this was NOT the actual
# cause. The real bug was a WPA3-SAE handshake failure on this old
# firmware (see broadcom-wpa2-default.conf in this same directory for the
# confirmed fix). Powersave was independently verified OFF at the driver
# level (`iw dev wlp2s0 get power_save` -> "off") while the connect/drop
# cycle still happened. Left in place as harmless, standard-practice
# hygiene for this hardware class — not because it fixes anything on its
# own.
[connection]
wifi.powersave = 2
