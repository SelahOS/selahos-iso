# SelahOS: default new Wi-Fi connections on Broadcom Apple hardware to
# WPA2-PSK instead of WPA3-SAE.
#
# 2026-09-06 CONFIRMED ROOT CAUSE on a real MacBook10,1 (BCM4350, brcmfmac,
# firmware dated Nov 26 2015 — three years before WPA3 was ratified): every
# "connects then drops within seconds" symptom chased over the previous two
# nights (power-save, roaming, driver selection, missing clm_blob/nvram
# calibration files) was a red herring. The actual failure, found by
# capturing wpa_supplicant's own log during a live connection attempt:
#
#   Config: added 'key_mgmt' value 'SAE FT-SAE'
#   wpa_supplicant: wlp2s0: WPA: Failed to select authenticated key
#     management type
#   wpa_supplicant: wlp2s0: WPA: Failed to set WPA key management and
#     encryption suites
#
# The test AP broadcasts WPA2+WPA3 mixed mode; NetworkManager picked SAE
# (WPA3) because the AP advertised it, wpa_supplicant could never start
# that handshake on this firmware, and NetworkManager's ~30s association
# timeout produced the exact "connecting -> disconnected" cycle seen from
# the very first report of this bug. Manually forcing the connection
# profile to wifi-sec.key-mgmt=wpa-psk (+ pmf disable) associated
# immediately, completed the 4-way handshake, and held a stable DHCP
# lease with working internet for the remainder of the test.
#
# This file applies that same fix as a *default* for any NEW Wi-Fi
# connection on brcmfmac/wl-driven hardware (i.e. every Broadcom chip
# SelahOS's own selah-wifi-driver targets — see that script's comment for
# the exact chip list) — it never overrides an explicitly-configured
# profile, only fills in the security method NetworkManager would
# otherwise auto-detect from the AP's advertised capabilities. Harmless
# on WPA2-only or open networks; only matters for mixed WPA2/WPA3 APs,
# which is exactly the case that broke here.
[connection-selahos-broadcom-wpa2-default]
match-device=driver:brcmfmac,driver:wl
802-11-wireless-security.key-mgmt=wpa-psk
802-11-wireless-security.pmf=1
