# SelahOS: brcmfmac tuning for Broadcom Wi-Fi on Apple hardware.
#
# 2026-09-05: added alongside wifi-powersave-off.conf (see that file's
# comment for the full incident this addresses — a MacBook10,1's BCM4350
# associating then dropping seconds later). roamoff disables the
# firmware's own background roaming/scan behavior, a secondary
# mitigation commonly cited for brcmfmac disconnect issues independent
# of NetworkManager's own power-save setting. Low risk: it only changes
# in-driver roaming behavior, not regulatory/legal radio parameters.
#
# 2026-09-06 UPDATE: retested on real hardware — this was NOT the actual
# cause either. See broadcom-wpa2-default.conf in NetworkManager/conf.d/
# for the confirmed root cause (a WPA3-SAE handshake failure) and fix.
# Left in place as harmless, standard-practice hygiene — not a fix on its
# own.
options brcmfmac roamoff=1
