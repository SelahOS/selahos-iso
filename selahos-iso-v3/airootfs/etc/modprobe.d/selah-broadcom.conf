# SelahOS: Broadcom Wi-Fi driver is chosen at boot by
# selah-wifi-driver.service based on the detected chip
# (brcmfmac for BCM4350/43602/4364-class, wl for BCM4331/4360-class).
# Blacklisting stops alias auto-loading only; the service's explicit
# modprobe still works. Do NOT force-load any of these in
# /etc/modules-load.d — that bypasses the blacklist and reintroduces
# the driver conflict that killed Wi-Fi on BCM4331 Macs.
blacklist wl
blacklist b43
blacklist b43legacy
blacklist ssb
blacklist bcma
blacklist brcmsmac
blacklist brcmfmac
