#
# /etc/pacman.conf shipped on the SelahOS v1.0-beta live ISO and (via
# selah-setup's install-time copy) on installed systems.
#
# bake-fixes handoff Task 2: previously no override existed here, so
# mkarchiso fell back to copying the BUILD profile's own pacman.conf
# (../pacman.conf, one directory up) into the ISO verbatim. That file's
# [selah-local] section points at an absolute file:// path on Dane's
# build machine only (used to pin the kernel package during the ISO
# build) — meaningless, and silently broken, on any shipped machine.
# It also never defined a SelahOS product repo at all, which is why
# `pacman -S selahbridgepro` (more precisely: `selah-apps`, see
# packaging/README.md — there is no package literally named
# "selahbridgepro") has never been resolvable on a live or installed
# system.
#
# Copyright (C) 2026 Selah Technologies LLC
#

[options]
HoldPkg     = pacman glibc
Architecture = auto
CheckSpace
SigLevel = Never
LocalFileSigLevel = Never
ParallelDownloads = 5
# 2026-09-04: pipewire-jack (the correct, requested choice — see
# selahos-install-packages/audio.txt) and jack2 both provide the same
# `jack` virtual package and explicitly conflict. jack2 is never
# requested by name anywhere in this project, but live-mirror-state-
# dependent dependency resolution let it get pulled in anyway on at
# least one real install, crashing selah-setup's audio pacstrap step
# non-interactively. It's also excluded from the bundled offline repo
# below, but this is kept too as a second, independent guarantee — the
# conflict should be structurally impossible, not just avoided by omission.
IgnorePkg = jack2

# 2026-09-04: bundled, on-ISO package repo (built by
# tools/build-offline-repo.sh, covers everything selah-setup pacstraps —
# see selahos-install-packages/*.txt) so a real install doesn't need
# internet access for anything that isn't genuinely optional. Listed
# first so pacman prefers it over any network repo for anything
# available locally.
[selahos-offline]
SigLevel = Never
Server = file:///usr/local/share/selahos-offline-repo

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# Chaotic-AUR: provides calamares, ckbcomp, dxvk, wineasio
[chaotic-aur]
Include = /etc/pacman.d/chaotic-mirrorlist

# ── SelahOS product repo (selah-apps, selah-device-editors, selah-theme,
# selah-tools — see packaging/README.md) ─────────────────────────────
# NOT LIVE YET as of this handoff: repo.selahos.io has no DNS record and
# no server behind it (packaging/README.md roadmap step 2, still
# unstarted — same gap as keys.selahos.io from the SelahBridgePro secret
# incident). Until that's stood up and packages are signed, `pacman -Sy`
# will report a sync failure for this one repo (harmless — other repos
# still sync) and `pacman -S selah-apps` will fail with "target not
# found". This section is left in place, disabled, so it activates the
# moment the server exists instead of needing another round of ISO
# fixes. Track the flip-on in the packaging roadmap, not here.
#[selahos]
#SigLevel = Never
#Server = https://repo.selahos.io/$arch
