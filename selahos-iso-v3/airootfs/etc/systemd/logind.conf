[Login]
HandleLidSwitch=suspend
# SELAH-49: left as "ignore" (not "suspend") so lid-close on AC power falls
# through to selah-clamshell (acpid-triggered) instead of logind suspending
# unconditionally. selah-clamshell still suspends manually when there's no
# external display to hand off to — see its comments for the safety case.
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
IdleAction=suspend
IdleActionSec=20min
