# macOS version -> OSX-KVM fetch-macOS-v2.py shortname + QEMU CPU model.
# Source of truth for shortnames/board-ids is OSX-KVM's own fetch-macOS-v2.py
# (products list), not hand-guessed here. CPU model follows OSX-KVM's own
# OpenCore-Boot.sh guidance: Penryn for High Sierra..Ventura, Skylake-Client
# for Sonoma/Sequoia/Tahoe.
#
# format: name:fetch_shortname:cpu_model
mojave:mojave:Penryn
catalina:catalina:Penryn
bigsur:big-sur:Penryn
monterey:monterey:Penryn
ventura:ventura:Penryn
sonoma:sonoma:Skylake-Client,-hle,-rtm
sequoia:sequoia:Skylake-Client,-hle,-rtm
tahoe:tahoe:Skylake-Client,-hle,-rtm
