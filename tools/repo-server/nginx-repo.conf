# ── SelahOS OTA package repo — nginx config snippet ────────────────────────────
# Static file serving for repo.selahos.io: packaging/publish.sh uploads
# signed *.pkg.tar.zst + *.sig + selahos.db.tar.gz(.sig) to
# /var/www/selahos-repo on web-core; this just serves that directory.
# Not auto-applied — same convention as tools/keygen-server/nginx-keygen.conf.

server {
    listen 443 ssl http2;
    server_name repo.selahos.io;

    # SSL — managed by certbot / Let's Encrypt
    ssl_certificate     /etc/letsencrypt/live/repo.selahos.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/repo.selahos.io/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/selahos-repo;

    location / {
        autoindex on;
        add_header Cache-Control "public, max-age=300";
    }
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name repo.selahos.io;
    return 301 https://$host$request_uri;
}
